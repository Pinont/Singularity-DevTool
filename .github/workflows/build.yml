name: build

on:
  push:
    branches: [ main, "rework/**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # maven.pinont.me's 2.0.0-SNAPSHOT is the Central 2.0.0 line (no PaginatedMenu /
      # CommandGroup / Attributes). DevTool v2 compiles against current lib main.
      # Install that source locally so CI matches; do not shade the lib into this jar.
      - name: Checkout SingularityLib (compile-time API)
        uses: actions/checkout@v4
        with:
          repository: Pinont/SingularityLib
          ref: main
          path: .ci/singularitylib

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install SingularityLib 2.0.0-SNAPSHOT locally
        run: |
          mvn -B -DskipTests install -f .ci/singularitylib/singularitylib-processor/pom.xml
          mvn -B -DskipTests install -f .ci/singularitylib/pom.xml

      - name: Build (compile + test against local lib snapshot)
        run: mvn -B -nsu clean package
